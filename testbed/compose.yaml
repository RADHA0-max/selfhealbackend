name: nanoclaw-person-c-testbed

services:
  testbed-app:
    image: python:3.11-slim
    working_dir: /workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python
      - -m
      - testbed.app.server
      - --host
      - 0.0.0.0
      - --port
      - "18080"
    volumes:
      - ./:/workspace/testbed:ro
    networks:
      - testbed-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  testbed-envoy:
    image: envoyproxy/envoy:v1.31-latest
    command:
      - -c
      - /etc/envoy/envoy.yaml
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - testbed-app
    networks:
      - testbed-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

networks:
  testbed-net:
    internal: true
